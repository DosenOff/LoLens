<svg viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C75E"/>
      <stop offset="100%" stop-color="#C89B3C"/>
    </linearGradient>
    <radialGradient id="lensGlass2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0AC8B9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0AC8B9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- final "L" of "LoL" - the letter being "inspected" -->
  <path d="M 430 70
           L 430 230
           L 545 230
           L 545 270
           L 388 270
           L 388 70
           Z"
        fill="url(#gold2)"/>

  <!-- the "Lo" as a magnifying glass: handle flares into an L-shaped foot,
       lens circle reads as the "o", hovering over the final L -->
  <path d="M 250 250
           L 292 250
           L 292 236
           L 330 198"
        fill="none" stroke="url(#gold2)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="255" cy="140" r="78" fill="url(#lensGlass2)"/>
  <circle cx="255" cy="140" r="78" fill="none" stroke="url(#gold2)" stroke-width="20"/>
</svg>
