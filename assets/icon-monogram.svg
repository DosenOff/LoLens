<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1D38"/>
      <stop offset="100%" stop-color="#0A0E14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C75E"/>
      <stop offset="100%" stop-color="#C89B3C"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0AC8B9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0AC8B9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle badge background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="106" fill="none" stroke="#5C4A22" stroke-width="2"/>

  <!-- the L, bold and centered-left to leave room for the lens over its corner -->
  <path d="M 168 128
           L 168 336
           L 296 336
           L 296 384
           L 120 384
           L 120 128
           Z"
        fill="url(#gold)"/>

  <!-- magnifying glass, lens positioned over the L's top-right corner -->
  <circle cx="308" cy="196" r="86" fill="url(#lensGlass)"/>
  <circle cx="308" cy="196" r="86" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <line x1="368" y1="256" x2="424" y2="312" stroke="url(#gold)" stroke-width="24" stroke-linecap="round"/>
</svg>
