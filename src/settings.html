<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoLens — Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy-deep: #0A0E14;
            --navy: #0A1428;
            --navy-panel: #0F1B33;
            --gold: #C89B3C;
            --gold-bright: #F0C75E;
            --gold-dim: #5C4A22;
            --parchment: #F0E6D2;
            --parchment-dim: #A09B8C;
            --parchment-faint: #5A5648;
            --red: #E08A8A;
            --green: #7FD99B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(ellipse at top, #0F1D38 0%, var(--navy-deep) 70%);
            color: var(--parchment);
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            padding: 16px 18px 32px;
            font-size: 13px;
        }

        .wrap {
            max-width: 100%;
            margin: 0 auto;
        }

        .frame {
            position: relative;
            border: 1px solid var(--gold-dim);
            background: linear-gradient(160deg, var(--navy-panel) 0%, var(--navy) 100%);
        }

        .frame::before,
        .frame::after,
        .frame .corner-tr,
        .frame .corner-bl {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border: 1.5px solid var(--gold);
            pointer-events: none;
        }

        .frame::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }

        .frame::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        .frame .corner-tr {
            top: -1px;
            right: -1px;
            border-left: none;
            border-bottom: none;
        }

        .frame .corner-bl {
            bottom: -1px;
            left: -1px;
            border-right: none;
            border-top: none;
        }

        .masthead {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--gold-dim);
            position: relative;
        }

        .masthead::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 50px;
            height: 2px;
            background: var(--gold);
        }

        .masthead h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 1px;
            color: var(--gold-bright);
            text-transform: uppercase;
        }

        .masthead .subtitle {
            color: var(--parchment-dim);
            font-size: 11px;
            margin-top: 3px;
            font-style: italic;
        }

        .topnav {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--gold-dim);
            color: var(--parchment-dim);
            cursor: pointer;
            font-size: 14px;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .nav-btn:hover {
            border-color: var(--gold);
            color: var(--gold-bright);
        }

        .nav-btn.active {
            border-color: var(--gold);
            color: var(--gold-bright);
            background: rgba(200, 155, 60, 0.1);
        }

        .panel {
            padding: 18px 20px;
            margin-bottom: 16px;
            overflow: visible;
        }

        .panel-title {
            font-family: 'Oswald', sans-serif;
            font-size: 13px;
            color: var(--gold-bright);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        /* Short explainer under a panel title (e.g. Population) - one
           sentence, muted, in the body serif rather than the mono/Oswald
           accents used for data/labels. */
        .panel-desc {
            font-size: 11px;
            line-height: 1.5;
            color: var(--parchment-dim);
            margin-bottom: 16px;
        }

        .field {
            margin-bottom: 18px;
            position: relative;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            font-size: 11px;
            color: var(--parchment-faint);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .field .hint {
            font-size: 10px;
            color: var(--parchment-faint);
            margin-top: 6px;
            font-style: italic;
        }

        /* Two dropdown fields side by side in one panel (Population's
           Patch + Tier) - each half is its own .field-sized flex child so
           the existing .combo positioning/label styling works unchanged. */
        .dual-field {
            display: flex;
            gap: 14px;
            margin-bottom: 0;
        }

        .dual-field .field-half {
            flex: 1;
            min-width: 0;
            margin-bottom: 0;
        }

        /* ---- role tabs ---- */
        .role-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .role-tab {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--gold-dim);
            color: var(--parchment-dim);
            font-family: 'Oswald', sans-serif;
            font-size: 11px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 7px 14px;
            cursor: pointer;
        }

        .role-tab:hover {
            border-color: var(--gold);
            color: var(--gold-bright);
        }

        .role-tab.active {
            border-color: var(--gold);
            color: var(--navy-deep);
            background: var(--gold);
        }

        /* ---- custom dropdown ("combo") ---- */
        .combo {
            position: relative;
        }

        .combo-trigger {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--gold-dim);
            color: var(--parchment);
            padding: 9px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            cursor: pointer;
            text-align: left;
        }

        .combo-trigger:hover,
        .combo-trigger.open {
            border-color: var(--gold);
        }

        .combo-trigger .chev {
            color: var(--parchment-faint);
            font-size: 10px;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .combo-search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--gold-dim);
            color: var(--parchment);
            padding: 9px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        .combo-search-input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .combo-search-input:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* The panel is toggled with the native `hidden` attribute from JS. This
     rule has to win over the class-based display:flex below it, or the
     panel renders permanently open regardless of `hidden` - author rules
     of equal specificity beat the browser's own [hidden]{display:none},
     so it has to be stated explicitly rather than assumed. */
        .combo-panel[hidden] {
            display: none;
        }

        .combo-panel {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 30;
            background: var(--navy-panel);
            border: 1px solid var(--gold);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
            /* ~6 rows tall (each row is ~30px: 14px vertical padding +
               ~16px line height) rather than the ~8 rows this used to
               show - a shorter list stays glanceable and doesn't sprawl
               over neighboring fields. */
            max-height: 188px;
            display: flex;
            flex-direction: column;
        }

        .combo-list {
            overflow-y: auto;
        }

        .combo-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            cursor: pointer;
            font-size: 12px;
            color: var(--parchment);
        }

        .combo-row:hover {
            background: rgba(200, 155, 60, 0.15);
        }

        .combo-row.selected {
            background: rgba(200, 155, 60, 0.1);
            color: var(--gold-bright);
        }

        .combo-row .row-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            border: 1px solid rgba(200, 155, 60, 0.3);
            background: #16243F;
            object-fit: cover;
        }

        /* Rank emblems are badge-shaped on a transparent background, not
           square champion portraits - no border/box behind them, just the
           image itself, sized down slightly from .row-icon. */
        .tier-row-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            object-fit: contain;
        }

        /* Same emblem, shown inline in the closed trigger button next to
           the selected tier's label (e.g. the "🦅 Diamond+" trigger). */
        .tier-trigger-icon {
            width: 14px;
            height: 14px;
            margin-right: 6px;
            vertical-align: middle;
            object-fit: contain;
        }

        .combo-row .row-name {
            flex: 1;
        }

        .combo-empty {
            padding: 12px 10px;
            font-size: 11px;
            color: var(--parchment-faint);
            font-style: italic;
        }

        /* ---- pool chips ---- */
        .pool-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .pool-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(200, 155, 60, 0.25);
            border-radius: 14px;
            padding: 4px 8px 4px 5px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--parchment);
        }

        .pool-chip img {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid rgba(200, 155, 60, 0.3);
            flex-shrink: 0;
        }

        .pool-chip .remove {
            cursor: pointer;
            color: var(--parchment-faint);
            font-size: 11px;
            padding-left: 2px;
        }

        .pool-chip .remove:hover {
            color: var(--red);
        }

        .save-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        .saved-note {
            font-size: 11px;
            color: var(--green);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
    </style>
</head>

<body>
    <div class="wrap">

        <div class="masthead">
            <div>
                <h1>LoLens</h1>
                <div class="subtitle">Settings</div>
            </div>
            <nav class="topnav">
                <button class="nav-btn" data-page="home" title="Home">&#8962;</button>
                <button class="nav-btn active" data-page="settings" title="Settings">&#9881;</button>
                <button class="nav-btn" data-page="about" title="About">&#9432;</button>
            </nav>
        </div>

        <div class="frame panel">
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="panel-title">Population</div>
            <p class="panel-desc">The data set used for all synergy and counter calculations. Wider tiers and longer
                windows give larger, more reliable samples.</p>
            <div class="dual-field">
                <div class="field-half">
                    <label for="patchTrigger">Patch</label>
                    <div class="combo" id="patchCombo">
                        <button type="button" class="combo-trigger" id="patchTrigger">
                            <span id="patchTriggerLabel">—</span>
                            <span class="chev">&#9662;</span>
                        </button>
                        <div class="combo-panel" id="patchPanel" hidden>
                            <div class="combo-list" id="patchList"></div>
                        </div>
                    </div>
                </div>
                <div class="field-half">
                    <label for="tierTrigger">Tier</label>
                    <div class="combo" id="tierCombo">
                        <button type="button" class="combo-trigger" id="tierTrigger">
                            <span id="tierTriggerLabel">—</span>
                            <span class="chev">&#9662;</span>
                        </button>
                        <div class="combo-panel" id="tierPanel" hidden>
                            <div class="combo-list" id="tierList"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="frame panel">
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="panel-title">Champion pools</div>

            <div class="role-tabs" id="roleTabs">
                <button class="role-tab active" data-role="top">Top</button>
                <button class="role-tab" data-role="jungle">Jungle</button>
                <button class="role-tab" data-role="middle">Mid</button>
                <button class="role-tab" data-role="bottom">Bottom</button>
                <button class="role-tab" data-role="utility">Support</button>
            </div>

            <!-- Pool chips now come BEFORE the search box: the search
                 combo's dropdown panel is position:absolute and expands
                 downward, so with search on top it used to cover this
                 exact list while you were adding to it - easy to lose
                 track of what's already in the pool mid-search. -->
            <div class="field">
                <label id="poolListLabel">Champions in TOP pool</label>
                <div class="pool-chips" id="poolChips"></div>
                <div class="hint" id="poolEmptyHint"></div>
            </div>

            <div class="field">
                <label for="champSearch">Add to the <span id="activeRoleLabel">TOP</span> pool</label>
                <div class="combo" id="champCombo">
                    <input type="text" class="combo-search-input" id="champSearch" placeholder="Search champions…"
                        autocomplete="off">
                    <div class="combo-panel" id="champPanel" hidden>
                        <div class="combo-list" id="champList"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="save-row">
            <span class="saved-note" id="settingsSavedNote">Saved</span>
        </div>
    </div>

    <script>
        // ---- nav ----
        document.querySelectorAll('.nav-btn').forEach((btn) => {
            btn.addEventListener('click', () => window.draftAPI.navigate(btn.dataset.page));
        });

        // Maps a populationTier value to its rank emblem image. Duplicated
        // (deliberately - it's a trivial pure string formula, not worth an
        // IPC round trip) from lib/rankEmblem.js's logic. Keep the two in
        // sync if that mapping ever changes.
        function rankEmblemUrl(tier) {
            if (!tier) return null;
            const key = tier.replace('_PLUS', '').replace('+', '').toLowerCase();
            return `../assets/rank-emblems/${key}.png`;
        }

        // ---- generic combo (custom dropdown) plumbing ----
        // Every dropdown on this page shares a `.combo` wrapper around a trigger
        // (a button for single-select rank/patch, a text input for the
        // multi-add champion search) and a `.combo-panel`. Opening one closes
        // any other open one; a document-level click listener closes whichever
        // panel is open when the click lands outside its `.combo`; Escape closes
        // and blurs whatever's focused.

        function closeCombo(combo) {
            const panel = combo.querySelector('.combo-panel');
            const trigger = combo.querySelector('.combo-trigger, .combo-search-input');
            if (panel) panel.hidden = true;
            if (trigger) {
                trigger.classList.remove('open');
                if (trigger === document.activeElement) trigger.blur();
            }
        }

        function closeAllCombosExcept(exceptCombo) {
            document.querySelectorAll('.combo').forEach((combo) => {
                if (combo !== exceptCombo) closeCombo(combo);
            });
        }

        // Single-select dropdown: a button trigger that opens/closes on click.
        function setupComboButton(triggerBtn, panelEl, { onOpen } = {}) {
            const combo = triggerBtn.closest('.combo');
            function open() {
                closeAllCombosExcept(combo);
                panelEl.hidden = false;
                triggerBtn.classList.add('open');
                if (onOpen) onOpen();
            }
            function close() { closeCombo(combo); }
            triggerBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (panelEl.hidden) open(); else close();
            });
            return { open, close };
        }

        // Multi-add dropdown: a text input that opens on focus/click and filters
        // as you type, rather than toggling on every click (typing shouldn't
        // close it).
        function setupComboInput(inputEl, panelEl, { onOpen } = {}) {
            const combo = inputEl.closest('.combo');
            function open() {
                if (inputEl.disabled) return;
                closeAllCombosExcept(combo);
                panelEl.hidden = false;
                if (onOpen) onOpen();
            }
            function close() { closeCombo(combo); }
            inputEl.addEventListener('focus', open);
            inputEl.addEventListener('click', (e) => { e.stopPropagation(); open(); });
            return { open, close };
        }

        document.addEventListener('click', (e) => {
            document.querySelectorAll('.combo').forEach((combo) => {
                if (!combo.contains(e.target)) closeCombo(combo);
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            document.querySelectorAll('.combo').forEach((combo) => closeCombo(combo));
        });

        // iconUrl is optional - patch rows don't pass one (no icon), tier
        // rows do (their rank emblem).
        function rowHtml(value, label, selected, iconUrl) {
            const icon = iconUrl
                ? `<img class="tier-row-icon" src="${iconUrl}" alt="" onerror="this.style.visibility='hidden'">`
                : '';
            return `<div class="combo-row${selected ? ' selected' : ''}" data-value="${value}">
      ${icon}<span class="row-name">${label}</span>
    </div>`;
        }

        // ---- comparison rank combo (single-select) ----
        const TIER_OPTIONS = [
            { value: 'EMERALD', label: 'Emerald (III/IV)' },
            { value: 'EMERALD+', label: 'Emerald+ (I/II)' },
            { value: 'DIAMOND', label: 'Diamond (III/IV)' },
            { value: 'DIAMOND+', label: 'Diamond+ (I/II)' },
            { value: 'MASTER_PLUS', label: 'Master+' }
        ];
        let selectedTier = 'EMERALD';

        const tierTrigger = document.getElementById('tierTrigger');
        const tierTriggerLabel = document.getElementById('tierTriggerLabel');
        const tierPanel = document.getElementById('tierPanel');
        const tierList = document.getElementById('tierList');

        // Sets the closed trigger's contents to the emblem + label for
        // whichever tier is currently selected.
        function setTierTriggerLabel() {
            const opt = TIER_OPTIONS.find((o) => o.value === selectedTier);
            const label = opt ? opt.label : selectedTier;
            const emblem = `<img class="tier-trigger-icon" src="${rankEmblemUrl(selectedTier)}" alt="" onerror="this.style.display='none'">`;
            tierTriggerLabel.innerHTML = `${emblem}${label}`;
        }

        function renderTierList() {
            tierList.innerHTML = TIER_OPTIONS.map((opt) => rowHtml(opt.value, opt.label, opt.value === selectedTier, rankEmblemUrl(opt.value))).join('');
            tierList.querySelectorAll('.combo-row').forEach((row) => {
                row.addEventListener('click', () => {
                    selectedTier = row.dataset.value;
                    setTierTriggerLabel();
                    tierComboCtl.close();
                    persist();
                });
            });
        }
        const tierComboCtl = setupComboButton(tierTrigger, tierPanel, { onOpen: renderTierList });

        // ---- data window combo (single-select) ----
        let patchOptionsData = { presets: [], patches: [] };
        let selectedPatchValue = 'all';

        const patchTrigger = document.getElementById('patchTrigger');
        const patchTriggerLabel = document.getElementById('patchTriggerLabel');
        const patchPanel = document.getElementById('patchPanel');
        const patchList = document.getElementById('patchList');

        function labelForPatchValue(value) {
            const preset = patchOptionsData.presets.find((p) => p.value === value);
            if (preset) return preset.label;
            if (value.startsWith('patch:')) return 'Patch ' + value.slice(6);
            return value;
        }
        function encodePatchFilter(filter) {
            if (!filter || filter.type === 'all') return 'all';
            if (filter.type === 'days') return `days:${filter.days}`;
            if (filter.type === 'patch') return `patch:${filter.patch}`;
            return 'all';
        }
        function decodePatchFilter(value) {
            if (value === 'all') return { type: 'all' };
            if (value.startsWith('days:')) return { type: 'days', days: Number(value.slice(5)) };
            if (value.startsWith('patch:')) return { type: 'patch', patch: value.slice(6) };
            return { type: 'all' };
        }
        function renderPatchList() {
            const rows = patchOptionsData.presets.map((p) => rowHtml(p.value, p.label, p.value === selectedPatchValue));
            if (patchOptionsData.patches.length > 0) {
                rows.push('<div class="combo-empty" style="font-style:normal; border-top:1px solid var(--gold-dim); padding-top:8px;">Specific patch</div>');
                rows.push(...patchOptionsData.patches.map((p) => rowHtml('patch:' + p, 'Patch ' + p, ('patch:' + p) === selectedPatchValue)));
            }
            patchList.innerHTML = rows.join('');
            patchList.querySelectorAll('.combo-row[data-value]').forEach((row) => {
                row.addEventListener('click', () => {
                    selectedPatchValue = row.dataset.value;
                    patchTriggerLabel.textContent = labelForPatchValue(selectedPatchValue);
                    patchComboCtl.close();
                    persist();
                });
            });
        }
        const patchComboCtl = setupComboButton(patchTrigger, patchPanel, { onOpen: renderPatchList });

        // ---- champion pool combo (search-to-add, per role) ----
        const ROLE_LABELS = { top: 'TOP', jungle: 'JUNGLE', middle: 'MID', bottom: 'BOTTOM', utility: 'SUPPORT' };
        const ROLE_KEYS = ['top', 'jungle', 'middle', 'bottom', 'utility'];

        let allChampions = []; // [{ name, iconUrl }]
        let pools = { top: [], jungle: [], middle: [], bottom: [], utility: [] };
        let activeRole = 'top';

        const roleTabs = document.getElementById('roleTabs');
        const activeRoleLabel = document.getElementById('activeRoleLabel');
        const poolListLabel = document.getElementById('poolListLabel');
        const poolChips = document.getElementById('poolChips');
        const poolEmptyHint = document.getElementById('poolEmptyHint');

        const champSearch = document.getElementById('champSearch');
        const champPanel = document.getElementById('champPanel');
        const champList = document.getElementById('champList');

        function iconHtml(iconUrl) {
            return iconUrl
                ? `<img class="row-icon" src="${iconUrl}" alt="" onerror="this.style.visibility='hidden'">`
                : `<span class="row-icon"></span>`;
        }

        // Champions already in the active pool are left out of the search
        // results entirely (they're already shown as chips above), so there's
        // no need for a checkmark or a toggle - picking a row always adds it.
        function renderChampList(filterText) {
            const q = (filterText || '').trim().toLowerCase();
            const activePool = new Set(pools[activeRole]);
            const available = allChampions.filter((c) => !activePool.has(c.name));
            const filtered = q ? available.filter((c) => c.name.toLowerCase().includes(q)) : available;

            if (filtered.length === 0) {
                champList.innerHTML = `<div class="combo-empty">${available.length === 0 ? 'Every champion is already in this pool.' : 'No champions found.'}</div>`;
                return;
            }
            champList.innerHTML = filtered.map((c) => `
      <div class="combo-row" data-name="${c.name}">
        ${iconHtml(c.iconUrl)}
        <span class="row-name">${c.name}</span>
      </div>`).join('');
            champList.querySelectorAll('.combo-row').forEach((row) => {
                row.addEventListener('click', () => addChampToPool(row.dataset.name));
            });
        }

        function addChampToPool(name) {
            const pool = pools[activeRole];
            if (!pool.includes(name)) pool.push(name);
            champSearch.value = '';
            renderChampList('');
            renderPoolChips();
            champSearch.focus();
            persist();
        }

        function renderPoolChips() {
            const label = ROLE_LABELS[activeRole];
            activeRoleLabel.textContent = label;
            poolListLabel.textContent = `Champions in ${label} pool`;
            champSearch.placeholder = `Search champions to add to ${label} pool…`;

            const pool = pools[activeRole];
            if (pool.length === 0) {
                poolChips.innerHTML = '';
                poolEmptyHint.textContent = `No champions in the ${label} pool yet — search below to add some.`;
                return;
            }
            poolEmptyHint.textContent = `${pool.length} champion(s) in this pool.`;
            poolChips.innerHTML = pool.map((name) => {
                const champ = allChampions.find((c) => c.name === name);
                const icon = champ && champ.iconUrl ? `<img src="${champ.iconUrl}" alt="" onerror="this.style.visibility='hidden'">` : '';
                return `<span class="pool-chip">${icon}<span>${name}</span><span class="remove" data-name="${name}" title="Remove">&#10005;</span></span>`;
            }).join('');
            poolChips.querySelectorAll('.remove').forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const name = btn.dataset.name;
                    const pool = pools[activeRole];
                    const idx = pool.indexOf(name);
                    if (idx !== -1) pool.splice(idx, 1);
                    renderPoolChips();
                    if (!champPanel.hidden) renderChampList(champSearch.value);
                    persist();
                });
            });
        }

        roleTabs.querySelectorAll('.role-tab').forEach((btn) => {
            btn.addEventListener('click', () => {
                activeRole = btn.dataset.role;
                roleTabs.querySelectorAll('.role-tab').forEach((b) => b.classList.toggle('active', b === btn));
                champSearch.value = '';
                champComboCtl.close();
                renderPoolChips();
            });
        });

        champSearch.addEventListener('input', () => renderChampList(champSearch.value));

        const champComboCtl = setupComboInput(champSearch, champPanel, {
            onOpen: () => renderChampList(champSearch.value)
        });

        async function init() {
            const [settings, championList, patchOptions] = await Promise.all([
                window.draftAPI.getSettings(),
                window.draftAPI.getChampionList(),
                window.draftAPI.getPatchOptions()
            ]);

            allChampions = championList; // [{ name, iconUrl }]

            pools = { top: [], jungle: [], middle: [], bottom: [], utility: [] };
            ROLE_KEYS.forEach((key) => {
                const saved = settings.championPools && settings.championPools[key];
                pools[key] = Array.isArray(saved) ? [...saved] : [];
            });

            selectedTier = settings.populationTier;
            setTierTriggerLabel();

            patchOptionsData = patchOptions;
            const encoded = encodePatchFilter(settings.patchFilter);
            const encodedIsValid = patchOptionsData.presets.some((p) => p.value === encoded)
                || (encoded.startsWith('patch:') && patchOptionsData.patches.includes(encoded.slice(6)));
            selectedPatchValue = encodedIsValid ? encoded : 'all';
            patchTriggerLabel.textContent = labelForPatchValue(selectedPatchValue);

            if (allChampions.length === 0) {
                champSearch.disabled = true;
                champSearch.placeholder = 'No champion data found — run fetch-champion-data.js';
            }

            renderPoolChips();
        }

        // Autosave: every mutation site below (rank pick, data-window pick, add/
        // remove champion) calls this directly instead of waiting on a Save
        // button. Flashes the "Saved" note as the only feedback that it happened.
        let savedNoteTimer = null;
        function persist() {
            window.draftAPI.updateSettings({
                championPools: pools,
                populationTier: selectedTier,
                patchFilter: decodePatchFilter(selectedPatchValue)
            });

            const note = document.getElementById('settingsSavedNote');
            note.style.opacity = '1';
            clearTimeout(savedNoteTimer);
            savedNoteTimer = setTimeout(() => { note.style.opacity = '0'; }, 1200);
        }

        init();
    </script>
</body>

</html>
