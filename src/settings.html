<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Intel — Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy-deep: #0A0E14;
            --navy: #0A1428;
            --navy-panel: #0F1B33;
            --gold: #C89B3C;
            --gold-bright: #F0C75E;
            --gold-dim: #5C4A22;
            --parchment: #F0E6D2;
            --parchment-dim: #A09B8C;
            --parchment-faint: #5A5648;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(ellipse at top, #0F1D38 0%, var(--navy-deep) 70%);
            color: var(--parchment);
            font-family: 'Spectral', serif;
            min-height: 100vh;
            padding: 16px 18px 32px;
            font-size: 13px;
        }

        .wrap {
            max-width: 100%;
            margin: 0 auto;
        }

        .frame {
            position: relative;
            border: 1px solid var(--gold-dim);
            background: linear-gradient(160deg, var(--navy-panel) 0%, var(--navy) 100%);
        }

        .frame::before,
        .frame::after,
        .frame .corner-tr,
        .frame .corner-bl {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border: 1.5px solid var(--gold);
            pointer-events: none;
        }

        .frame::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }

        .frame::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        .frame .corner-tr {
            top: -1px;
            right: -1px;
            border-left: none;
            border-bottom: none;
        }

        .frame .corner-bl {
            bottom: -1px;
            left: -1px;
            border-right: none;
            border-top: none;
        }

        .masthead {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 12px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--gold-dim);
            position: relative;
        }

        .masthead::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 50px;
            height: 2px;
            background: var(--gold);
        }

        .masthead h1 {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: 1px;
            color: var(--gold-bright);
            text-transform: uppercase;
        }

        .masthead .subtitle {
            color: var(--parchment-dim);
            font-size: 11px;
            margin-top: 3px;
            font-style: italic;
        }

        .topnav {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--gold-dim);
            color: var(--parchment-dim);
            cursor: pointer;
            font-size: 14px;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .nav-btn:hover {
            border-color: var(--gold);
            color: var(--gold-bright);
        }

        .nav-btn.active {
            border-color: var(--gold);
            color: var(--gold-bright);
            background: rgba(200, 155, 60, 0.1);
        }

        .panel {
            padding: 18px 20px;
            margin-bottom: 16px;
        }

        .panel-title {
            font-family: 'Oswald', sans-serif;
            font-size: 13px;
            color: var(--gold-bright);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            font-size: 11px;
            color: var(--parchment-faint);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .field .hint {
            font-size: 10px;
            color: var(--parchment-faint);
            margin-top: 5px;
            font-style: italic;
        }

        select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--gold-dim);
            color: var(--parchment);
            padding: 8px 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }

        select:focus {
            outline: none;
            border-color: var(--gold);
        }

        select[multiple] {
            height: 160px;
        }

        select[multiple] option {
            padding: 3px 6px;
        }

        .save-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }

        button.save {
            background: var(--gold);
            border: none;
            color: var(--navy-deep);
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 12px;
            padding: 9px 22px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button.save:hover {
            background: var(--gold-bright);
        }

        .saved-note {
            font-size: 11px;
            color: #7FD99B;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
    </style>
</head>

<body>
    <div class="wrap">

        <div class="masthead">
            <div>
                <h1>Draft Intel</h1>
                <div class="subtitle">Settings</div>
            </div>
            <nav class="topnav">
                <button class="nav-btn" data-page="home" title="Home">&#8962;</button>
                <button class="nav-btn active" data-page="settings" title="Settings">&#9881;</button>
                <button class="nav-btn" data-page="about" title="About">&#9432;</button>
            </nav>
        </div>

        <div class="frame panel">
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="panel-title">Comparison rank</div>
            <div class="field">
                <label for="tierSelect">Compare your picks against</label>
                <select id="tierSelect">
                    <option value="EMERALD">Emerald (III/IV)</option>
                    <option value="EMERALD+">Emerald+ (I/II)</option>
                    <option value="DIAMOND">Diamond (III/IV)</option>
                    <option value="DIAMOND+">Diamond+ (I/II)</option>
                    <option value="MASTER_PLUS">Master+</option>
                </select>
            </div>
        </div>

        <div class="frame panel">
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="panel-title">Data window</div>
            <div class="field">
                <label for="patchSelect">Population data to use</label>
                <select id="patchSelect"></select>
                <div class="hint" id="patchHint"></div>
            </div>
        </div>

        <div class="frame panel">
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div class="panel-title">Champion pool</div>
            <div class="field">
                <label for="poolSelect">Champions to get recommendations for (Cmd/Ctrl-click to select multiple)</label>
                <select id="poolSelect" multiple></select>
                <div class="hint" id="poolHint"></div>
            </div>
        </div>

        <div class="save-row">
            <button class="save" id="settingsSave">Save</button>
            <span class="saved-note" id="settingsSavedNote">Saved</span>
        </div>
    </div>

    <script>
        document.querySelectorAll('.nav-btn').forEach((btn) => {
            btn.addEventListener('click', () => window.draftAPI.navigate(btn.dataset.page));
        });

        const tierSelect = document.getElementById('tierSelect');
        const patchSelect = document.getElementById('patchSelect');
        const patchHint = document.getElementById('patchHint');
        const poolSelect = document.getElementById('poolSelect');
        const poolHint = document.getElementById('poolHint');

        // Encodes a patchFilter object into the single <select> value string
        // this page uses, and back again on save.
        function encodePatchFilter(filter) {
            if (!filter || filter.type === 'all') return 'all';
            if (filter.type === 'days') return `days:${filter.days}`;
            if (filter.type === 'patch') return `patch:${filter.patch}`;
            return 'all';
        }
        function decodePatchFilter(value) {
            if (value === 'all') return { type: 'all' };
            if (value.startsWith('days:')) return { type: 'days', days: Number(value.slice(5)) };
            if (value.startsWith('patch:')) return { type: 'patch', patch: value.slice(6) };
            return { type: 'all' };
        }

        async function init() {
            const [settings, championList, patchOptions] = await Promise.all([
                window.draftAPI.getSettings(),
                window.draftAPI.getChampionList(),
                window.draftAPI.getPatchOptions()
            ]);

            tierSelect.value = settings.populationTier;

            // Patch dropdown: presets first, then every real patch we've sampled.
            const optionGroups = [];
            optionGroups.push(patchOptions.presets.map((p) => `<option value="${p.value}">${p.label}</option>`).join(''));
            if (patchOptions.patches.length > 0) {
                optionGroups.push(
                    `<optgroup label="Specific patch">` +
                    patchOptions.patches.map((p) => `<option value="patch:${p}">Patch ${p}</option>`).join('') +
                    `</optgroup>`
                );
            }
            patchSelect.innerHTML = optionGroups.join('');
            patchSelect.value = encodePatchFilter(settings.patchFilter);
            // If the saved filter references a patch we no longer have (data was
            // refreshed since), fall back to all-time rather than silently show
            // the wrong selection.
            if (patchSelect.value !== encodePatchFilter(settings.patchFilter)) {
                patchSelect.value = 'all';
            }
            patchHint.textContent = patchOptions.patches.length === 0
                ? 'No per-patch data recorded yet — run fetch-population-data to start tracking patches.'
                : patchOptions.patches.length + ' patch(es) recorded.';

            // Champion pool: native multi-select populated from Data Dragon.
            if (championList.length === 0) {
                poolHint.textContent = 'No champion data found — run `node scripts/fetch-champion-data.js` first.';
                poolSelect.disabled = true;
            } else {
                poolSelect.innerHTML = championList.map((name) => `<option value="${name}">${name}</option>`).join('');
                const currentPool = new Set(settings.championPool || []);
                [...poolSelect.options].forEach((opt) => { opt.selected = currentPool.has(opt.value); });
                poolHint.textContent = `${settings.championPool.length} champion(s) currently in your pool.`;
            }
        }

        document.getElementById('settingsSave').addEventListener('click', () => {
            const championPool = [...poolSelect.selectedOptions].map((opt) => opt.value);
            const populationTier = tierSelect.value;
            const patchFilter = decodePatchFilter(patchSelect.value);

            window.draftAPI.updateSettings({ championPool, populationTier, patchFilter });
            poolHint.textContent = `${championPool.length} champion(s) currently in your pool.`;

            const note = document.getElementById('settingsSavedNote');
            note.style.opacity = '1';
            setTimeout(() => { note.style.opacity = '0'; }, 1800);
        });

        init();
    </script>
</body>

</html>
