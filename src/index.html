<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Intel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep: #0A0E14;
    --navy: #0A1428;
    --navy-panel: #0F1B33;
    --navy-panel-raised: #16243F;
    --gold: #C89B3C;
    --gold-bright: #F0C75E;
    --gold-dim: #5C4A22;
    --teal: #0AC8B9;
    --red: #C74B4B;
    --parchment: #F0E6D2;
    --parchment-dim: #A09B8C;
    --parchment-faint: #5A5648;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse at top, #0F1D38 0%, var(--navy-deep) 70%);
    color: var(--parchment);
    font-family: 'Spectral', serif;
    min-height:100vh;
    padding: 32px 24px 60px;
  }
  .wrap{
    max-width: 1000px;
    margin: 0 auto;
  }

  /* ---- ornamental frame helper ---- */
  .frame{
    position: relative;
    border: 1px solid var(--gold-dim);
    background: linear-gradient(160deg, var(--navy-panel) 0%, var(--navy) 100%);
  }
  .frame::before, .frame::after,
  .frame .corner-tr, .frame .corner-bl{
    content:'';
    position:absolute;
    width: 14px; height: 14px;
    border: 1.5px solid var(--gold);
    pointer-events:none;
  }
  .frame::before{ top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .frame::after{ bottom:-1px; right:-1px; border-left:none; border-top:none; }
  .frame .corner-tr{ top:-1px; right:-1px; border-left:none; border-bottom:none; }
  .frame .corner-bl{ bottom:-1px; left:-1px; border-right:none; border-top:none; }

  /* header */
  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding-bottom: 20px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--gold-dim);
    position: relative;
  }
  .masthead::after{
    content:'';
    position:absolute;
    bottom:-3px; left:0;
    width: 60px; height: 2px;
    background: var(--gold);
  }
  .masthead h1{
    font-family:'Oswald', sans-serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 1px;
    color: var(--gold-bright);
    text-transform: uppercase;
  }
  .masthead .subtitle{
    color: var(--parchment-dim);
    font-size: 13px;
    margin-top: 6px;
    font-family: 'Spectral', serif;
    font-style: italic;
  }
  .status{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--parchment-dim);
    text-align:right;
    letter-spacing: 0.5px;
  }
  .status .dot{
    display:inline-block;
    width:7px; height:7px;
    border-radius:50%;
    background: var(--parchment-faint);
    margin-right:6px;
  }
  .status.live .dot{ background: var(--teal); box-shadow: 0 0 8px var(--teal); }
  .status.live{ color: var(--teal); }

  /* turn banner */
  .turn-banner{
    position: relative;
    background: linear-gradient(90deg, rgba(200,155,60,0.18), rgba(200,155,60,0.02) 70%);
    border-top: 1px solid var(--gold);
    border-bottom: 1px solid var(--gold);
    padding: 14px 20px;
    margin-bottom: 32px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .turn-banner .label{
    font-family:'Oswald', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold-bright);
  }
  .turn-banner .timer{
    font-family:'JetBrains Mono', monospace;
    font-size: 18px;
    color: var(--gold-bright);
    text-shadow: 0 0 10px rgba(240,199,94,0.4);
  }

  /* team columns */
  .draft{
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 24px;
    margin-bottom: 32px;
  }
  .team{ min-width:0; padding: 18px; }
  .team-header{
    font-family:'Oswald', sans-serif;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding-bottom: 10px;
    margin-bottom: 16px;
    border-bottom: 1px solid;
    display:flex;
    justify-content:space-between;
  }
  .team.blue{ border-color: rgba(10,200,185,0.4); }
  .team.blue .team-header{ color: var(--teal); border-color: rgba(10,200,185,0.3); }
  .team.red{ border-color: rgba(199,75,75,0.4); }
  .team.red .team-header{ color: #E08A8A; border-color: rgba(199,75,75,0.3); }

  .section-label{
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--parchment-faint);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 16px 0 8px;
  }
  .section-label:first-of-type{ margin-top: 0; }

  .slot{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 9px 12px;
    margin-bottom: 6px;
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(200,155,60,0.15);
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px);
  }
  .slot.filled{ background: rgba(200,155,60,0.06); border-color: rgba(200,155,60,0.3); }
  .slot.active{
    border-color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold) inset, 0 0 12px rgba(200,155,60,0.25);
    background: rgba(200,155,60,0.1);
  }
  .slot .portrait{
    width: 36px; height: 36px;
    background: linear-gradient(160deg, #2A3B5C, #16243F);
    border: 1px solid rgba(200,155,60,0.3);
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size: 10px;
    color: var(--parchment-faint);
    font-family:'JetBrains Mono', monospace;
  }
  .slot.filled .portrait{ color: var(--gold-bright); border-color: var(--gold); }
  .slot .name{
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: var(--parchment-dim);
    letter-spacing: 0.3px;
  }
  .slot.filled .name{ color: var(--parchment); }
  .slot .role{
    margin-left: auto;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--parchment-faint);
    letter-spacing: 0.5px;
  }

  .ban-row{
    display:flex;
    gap: 6px;
  }
  .ban-chip{
    width: 32px; height: 32px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(199,75,75,0.25);
    display:flex; align-items:center; justify-content:center;
    font-size: 9px;
    color: var(--parchment-faint);
    font-family:'JetBrains Mono', monospace;
    position: relative;
  }
  .ban-chip.filled{
    background: rgba(199,75,75,0.15);
    border-color: var(--red);
    color: #E08A8A;
  }
  .ban-chip.filled::before, .ban-chip.filled::after{
    content:'';
    position:absolute;
    top:50%; left:50%;
    width: 130%; height: 1px;
    background: rgba(199,75,75,0.6);
  }
  .ban-chip.filled::before{ transform: translate(-50%,-50%) rotate(45deg); }
  .ban-chip.filled::after{ transform: translate(-50%,-50%) rotate(-45deg); }

  /* center spine */
  .spine{
    width: 1px;
    background: linear-gradient(180deg, transparent, var(--gold-dim) 15%, var(--gold-dim) 85%, transparent);
    position: relative;
    margin: 0 4px;
  }
  .spine .you-tag{
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%,-50%) rotate(90deg);
    background: var(--navy-deep);
    padding: 4px 10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--gold);
    white-space: nowrap;
    border: 1px solid var(--gold-dim);
  }

  /* scouting report */
  .report{ padding: 0; }
  .report-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--gold-dim);
  }
  .report-header .title{
    font-family:'Oswald', sans-serif;
    font-size: 16px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--gold-bright);
  }
  .report-header .meta{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--parchment-faint);
  }
  .report-body{
    padding: 20px;
  }
  .matchup-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .matchup-card{
    border: 1px solid rgba(200,155,60,0.2);
    background: rgba(0,0,0,0.2);
    padding: 14px 16px;
    position: relative;
  }
  .matchup-card::before{
    content:'';
    position:absolute;
    top:0; left:0;
    width: 100%; height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .matchup-card .champ{
    font-family:'Oswald', sans-serif;
    font-size: 15px;
    letter-spacing: 0.3px;
    margin-bottom: 10px;
    color: var(--parchment);
  }
  .matchup-card .stat-line{
    display:flex;
    justify-content:space-between;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--parchment-dim);
    margin-bottom: 5px;
  }
  .matchup-card .stat-line .value{ color: var(--parchment); }
  .matchup-card .stat-line .value.pos{ color: #7FD99B; }
  .matchup-card .stat-line .value.neg{ color: #E08A8A; }
  .matchup-card .games{
    color: var(--parchment-faint);
    font-size: 11px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(200,155,60,0.12);
  }

  footer{
    margin-top: 28px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--parchment-faint);
    text-align:center;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Draft Intel</h1>
      <div class="subtitle">Live champion select &amp; historical matchup analysis</div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Waiting for League...</span></div>
  </div>

  <div class="turn-banner">
    <span class="label" id="turnLabel">Not in champion select</span>
    <span class="timer" id="turnTimer">--:--</span>
  </div>

  <div class="draft">
    <div class="team blue frame">
      <div class="corner-tr"></div><div class="corner-bl"></div>
      <div class="team-header"><span>Your team</span><span>Order</span></div>

      <div class="section-label">Picks</div>
      <div id="myTeamSlots"></div>

      <div class="section-label">Bans</div>
      <div class="ban-row" id="myBans"></div>
    </div>

    <div class="spine"><span class="you-tag">you</span></div>

    <div class="team red frame">
      <div class="corner-tr"></div><div class="corner-bl"></div>
      <div class="team-header"><span>Enemy team</span><span>Order</span></div>

      <div class="section-label">Picks</div>
      <div id="theirTeamSlots"></div>

      <div class="section-label">Bans</div>
      <div class="ban-row" id="theirBans"></div>
    </div>
  </div>

  <div class="report frame">
    <div class="corner-tr"></div><div class="corner-bl"></div>
    <div class="report-header">
      <div class="title" id="reportTitle">Your history vs. enemy picks</div>
      <div class="meta" id="reportMeta">Waiting for a pick...</div>
    </div>
    <div class="report-body" id="reportBody">
      <div class="report-empty">No enemy champion picked yet.</div>
    </div>
  </div>

  <footer id="footerNote">not yet connected · waiting for League</footer>
</div>

<script>
  // Matchup stats now come from real personal match history via
  // session.matchupData, computed in main.js from lib/matchupStats.js.
  // No more mock data here.

  // League doesn't assign a real lane for bots/enemy players in custom
  // games (assignedPosition comes back blank). This is a best-effort guess
  // based on standard team order, clearly marked with "~" so it's never
  // mistaken for confirmed data.
  const GUESSED_LANE_ORDER = ['top', 'jungle', 'middle', 'bottom', 'support'];

  function abbreviate(name) {
    return name.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase();
  }

  function renderTeamSlots(containerId, players, localPlayerCellId) {
    const el = document.getElementById(containerId);
    el.innerHTML = players.map((p, index) => {
      const filled = Boolean(p.championName);
      const isYou = p.cellId === localPlayerCellId;
      const classes = ['slot', filled ? 'filled' : '', isYou ? 'active' : ''].filter(Boolean).join(' ');
      const portraitText = filled ? abbreviate(p.championName) : '?';
      const nameText = filled ? p.championName : (isYou ? 'Your pick pending' : 'Waiting');

      let roleText;
      if (p.position) {
        roleText = p.position.toUpperCase();
      } else if (isYou) {
        roleText = 'YOU';
      } else {
        roleText = '~' + (GUESSED_LANE_ORDER[index] || '').toUpperCase();
      }

      return `
        <div class="${classes}">
          <div class="portrait">${portraitText}</div>
          <div class="name">${nameText}</div>
          <div class="role">${roleText}</div>
        </div>`;
    }).join('');
  }

  function renderBans(containerId, banNames) {
    const el = document.getElementById(containerId);
    const chips = banNames.map((name) => `<div class="ban-chip filled">${abbreviate(name)}</div>`);
    while (chips.length < 3) chips.push('<div class="ban-chip"></div>');
    el.innerHTML = chips.join('');
  }

  function renderReport(session) {
    const enemyPick = session.theirTeam.find((p) => p.championName);
    const title = document.getElementById('reportTitle');
    const meta = document.getElementById('reportMeta');
    const body = document.getElementById('reportBody');

    if (!enemyPick) {
      meta.textContent = 'Waiting for a pick...';
      body.innerHTML = '<div class="report-empty">No enemy champion picked yet.</div>';
      return;
    }

    meta.textContent = `${enemyPick.championName} picked · enemy team`;

    const stats = session.matchupData?.[enemyPick.championName];
    if (!stats || stats.length === 0) {
      body.innerHTML = `<div class="report-empty">No recorded games vs ${enemyPick.championName} yet.</div>`;
      return;
    }

    body.innerHTML = `<div class="matchup-grid">${stats.map((s) => `
      <div class="matchup-card">
        <div class="champ">${s.champion}</div>
        <div class="stat-line"><span>Win rate</span><span class="value ${s.winRate >= 50 ? 'pos' : 'neg'}">${s.winRate}%</span></div>
        <div class="games">${s.wins}/${s.games} games</div>
      </div>`).join('')}</div>`;
  }

  function formatTime(totalSeconds) {
    const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
    const s = String(totalSeconds % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function render(session) {
    document.getElementById('status').classList.add('live');
    document.getElementById('statusText').textContent = `Champion select — ${session.phase}`;
    document.getElementById('footerNote').textContent = 'live · connected to League Client';

    document.getElementById('turnLabel').textContent = session.isMyTurn
      ? 'Your turn to pick'
      : 'Waiting for other players...';
    document.getElementById('turnTimer').textContent = formatTime(session.timeLeftSeconds);

    renderTeamSlots('myTeamSlots', session.myTeam, session.localPlayerCellId);
    renderTeamSlots('theirTeamSlots', session.theirTeam, session.localPlayerCellId);
    renderBans('myBans', session.bans.mine);
    renderBans('theirBans', session.bans.theirs);
    renderReport(session);
  }

  function resetToIdle() {
    document.getElementById('status').classList.remove('live');
    document.getElementById('statusText').textContent = 'Waiting for champion select...';
    document.getElementById('footerNote').textContent = 'connected to League · not in champion select';
    document.getElementById('turnLabel').textContent = 'Not in champion select';
    document.getElementById('turnTimer').textContent = '--:--';
    document.getElementById('myTeamSlots').innerHTML = '';
    document.getElementById('theirTeamSlots').innerHTML = '';
    document.getElementById('myBans').innerHTML = '';
    document.getElementById('theirBans').innerHTML = '';
    document.getElementById('reportMeta').textContent = 'Waiting for a pick...';
    document.getElementById('reportBody').innerHTML = '<div class="report-empty">No enemy champion picked yet.</div>';
  }

  window.draftAPI.onSessionUpdate(render);
  window.draftAPI.onSessionEnded(resetToIdle);
</script>
</body>
</html>
