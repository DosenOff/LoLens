<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: 'Oswald', 'Segoe UI', sans-serif;
            color: #F0E6D2;
        }

        .card {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            background: linear-gradient(160deg, #0F1B33, #0A1428);
            border: 1px solid #C89B3C;
            border-radius: 4px;
            padding: 12px 14px;
        }

        .header {
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #C89B3C;
            border-bottom: 1px solid rgba(200, 155, 60, 0.3);
            padding-bottom: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 3px 0;
            color: #A09B8C;
        }

        .row .champ {
            color: #F0E6D2;
        }

        .row .value.pos {
            color: #7FD99B;
        }

        .row .value.neg {
            color: #E08A8A;
        }

        .empty {
            font-size: 12px;
            color: #5A5648;
            font-style: italic;
        }

        #baseline {
            white-space: nowrap;
            overflow: hidden;
            font-size: 11px;
            padding: 6px 0;
            margin-bottom: 6px;
            border-bottom: 1px solid rgba(200, 155, 60, 0.2);
            color: #A09B8C;
            font-family: 'JetBrains Mono', monospace;
        }

        #baseline .champ {
            color: #F0E6D2;
            font-weight: 500;
            font-family: 'Oswald', sans-serif;
        }

        #baseline .pos {
            color: #7FD99B;
        }

        #baseline .neg {
            color: #E08A8A;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <span id="phase">Champ select</span>
            <span id="timer"></span>
        </div>
        <div id="baseline"></div>
        <div id="body">
            <div class="empty">Waiting for a pick...</div>
        </div>
    </div>

    <script>
        // Matchup stats and the personal-vs-population baseline both come from
        // real data computed in main.js (lib/matchupStats.js, lib/populationStats.js).

        // Shrinks font-size on an element until its content fits on one line
        // (or hits minPx, whichever comes first - long names just get small
        // rather than wrapping or breaking the layout).
        function fitOneLine(el, maxPx = 11, minPx = 8) {
            let size = maxPx;
            el.style.fontSize = size + 'px';
            while (el.scrollWidth > el.clientWidth && size > minPx) {
                size -= 0.5;
                el.style.fontSize = size + 'px';
            }
        }

        function renderBaseline(session) {
            const el = document.getElementById('baseline');
            const comparison = session.personalVsPopulation;

            if (!comparison) {
                el.innerHTML = '';
                return;
            }

            const you = comparison.personal ? `${comparison.personal.winRate}%` : '—';
            const pop = comparison.population ? `${comparison.population.winRate}%` : '—';
            let deltaHtml = '—';
            if (comparison.personal && comparison.population) {
                const delta = Math.round((comparison.personal.winRate - comparison.population.winRate) * 10) / 10;
                const cls = delta >= 0 ? 'pos' : 'neg';
                deltaHtml = `<span class="${cls}">${delta >= 0 ? '+' : ''}${delta}%</span>`;
            }

            el.innerHTML = `<span class="champ">${comparison.championName}</span> · You ${you} · ${comparison.tier} ${pop} · ${deltaHtml}`;
            fitOneLine(el);
        }

        function render(session) {
            document.getElementById('timer').textContent = session.timeLeftSeconds + 's';
            renderBaseline(session);

            const enemyPick = session.theirTeam.find((p) => p.championName);
            const body = document.getElementById('body');

            if (!enemyPick) {
                body.innerHTML = '<div class="empty">Waiting for a pick...</div>';
                return;
            }

            const stats = session.matchupData?.[enemyPick.championName];
            if (!stats || stats.length === 0) {
                body.innerHTML = `<div class="empty">No recorded games vs ${enemyPick.championName} yet</div>`;
                return;
            }

            body.innerHTML = stats.map(s => `
        <div class="row">
            <span class="champ">${s.champion}</span>
            <span class="value ${s.winRate >= 50 ? 'pos' : 'neg'}">${s.winRate}% · ${s.games}g</span>
        </div>
    `).join('');
        }

        if (!window.overlayAPI) {
            document.getElementById('body').innerHTML =
                '<div class="empty">overlayAPI not available — check overlay-preload.js path/placement</div>';
        } else {
            window.overlayAPI.onUpdate(render);
        }
    </script>
</body>

</html>
