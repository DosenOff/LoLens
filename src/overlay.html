<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600&family=Inter:wght@400;500&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy-deep: #05070C;
            --navy: #060C18;
            --navy-panel: #0A1424;
            --gold: #C89B3C;
            --gold-bright: #F0C75E;
            --gold-dim: rgba(200, 155, 60, 0.3);
            --parchment: #F0E6D2;
            --parchment-dim: #A09B8C;
            --parchment-faint: #5A5648;
            --green: #7FD99B;
            --red: #E08A8A;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: 'Teko', 'Segoe UI', sans-serif;
            color: var(--parchment);
            -webkit-app-region: no-drag;
            /* Paired with app.commandLine.appendSwitch('disable-lcd-text')
               in main.js - ClearType subpixel AA assumes an opaque
               background and renders wrong on this window's transparent
               one (the "stretched" look on Windows). Grayscale AA doesn't
               have that assumption. */
            -webkit-font-smoothing: antialiased;
        }

        /* macOS applies a compositor-level rounded corner to frameless/
           transparent BrowserWindows that can't be turned off from the app
           side. Instead of drawing the gold frame flush with the window
           edge (where it would get visibly clipped by that rounding), it's
           inset a few px on all sides so the corner brackets always render
           fully intact regardless of the native window shape. */
        .inset {
            box-sizing: border-box;
            width: 100%;
            padding: 5px;
        }

        .frame {
            position: relative;
            width: 100%;
            box-sizing: border-box;
            background: linear-gradient(160deg, var(--navy-panel) 0%, var(--navy) 100%);
            border: 1px solid var(--gold-dim);
            padding: 5px 16px 3px;
        }

        .frame::before,
        .frame::after,
        .frame .corner-tr,
        .frame .corner-bl {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border: 1.5px solid var(--gold);
            pointer-events: none;
        }

        .frame::before {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }

        .frame::after {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        .frame .corner-tr {
            top: -1px;
            right: -1px;
            border-left: none;
            border-bottom: none;
        }

        .frame .corner-bl {
            bottom: -1px;
            left: -1px;
            border-right: none;
            border-top: none;
        }

        /* A thin drag handle above the header - lets the window be moved
           without needing focus (works via the OS window manager, not app
           focus, so it's compatible with focusable:false in main.js). */
        .grip {
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 5px;
            margin-bottom: 3px;
            cursor: grab;
        }

        .grip span {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--parchment-faint);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            -webkit-app-region: drag;
        }

        .header-actions {
            display: flex;
            align-items: center;
            -webkit-app-region: no-drag;
        }

        /* Collapse toggle now lives as a tab at the bottom of the frame
           (see .collapse-tab below) rather than in the header - kept this
           rule name-compatible via #collapseBtn id, just restyled/moved. */

        .header .title {
            font-family: 'Teko', 'Segoe UI', sans-serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-bright);
            white-space: nowrap;
            line-height: 1;
            /* overflow/text-overflow intentionally removed - they were
               clipping the rotated .brand-mark diamond's bounding box */
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: var(--gold-bright);
            font-family: 'Teko', 'Segoe UI', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 0;
            -webkit-app-region: no-drag;
        }

        .header .timer {
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 14px;
            color: var(--gold-bright);
            line-height: 1;
            flex-shrink: 0;
        }

        .divider {
            height: 1px;
            background: var(--gold-dim);
            /* negative L/R margin cancels .frame's 16px padding so the
               line bleeds to the frame's border edges, matching Rabadon's
               full-width divider instead of stopping short at the inset */
            margin: 3px -16px;
        }

        .collapse-tab {
            position: absolute;
            left: 50%;
            bottom: 3px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 11px;
            background: rgba(200, 155, 60, 0.08);
            border: 1px solid var(--gold-dim);
            color: var(--parchment-faint);
            font-size: 9px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            -webkit-app-region: no-drag;
        }

        .collapse-tab:hover {
            color: var(--gold-bright);
            border-color: var(--gold);
        }

        /* ---- brand (header, list view) ---- */

        .brand {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .brand-mark {
            width: 9px;
            height: 9px;
            flex-shrink: 0;
            border: 1.5px solid var(--gold);
            transform: rotate(45deg);
        }

        .brand-name {
            font-family: 'Teko', 'Segoe UI', sans-serif;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-bright);
        }

        /* ---- context bar (role vs enemy comp) ---- */

        .context-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 5px;
            margin-bottom: 8px;
        }

        .role-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .role-chip .role-text {
            font-family: 'Teko', 'Segoe UI', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--parchment);
            line-height: 1;
        }

        .role-chip .vs {
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--parchment-faint);
            line-height: 1;
        }

        .enemy-comp {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Each slot is a small stacked box: a role-label layer underneath,
           normally fully covered by the portrait sitting on top of it -
           like a lid on a box. Sized here so the (bigger) assumed-opponent
           slot doesn't shift its neighbors when it grows. */
        .enemy-slot {
            position: relative;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .enemy-slot.assumed-slot {
            width: 30px;
            height: 30px;
        }

        .role-reveal {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 8px;
            letter-spacing: 0.5px;
            color: var(--parchment-faint);
            background: rgba(0, 0, 0, 0.35);
            border: 1px dashed rgba(200, 155, 60, 0.4);
            opacity: 0;
            transition: opacity 0.12s ease;
            pointer-events: none;
        }

        /* Official Riot role icon shown as the backdrop underneath a
           lifted portrait mid-drag (see .role-reveal above). Falls back to
           the plain text label (see wireRoleRevealFallbacks()) if the
           CommunityDragon asset ever 404s, rather than a broken-image icon. */
        .role-reveal-icon {
            width: 14px;
            height: 14px;
            object-fit: contain;
            opacity: 0.9;
        }

        /* The portrait is the "lid" - lifting it (dragging it away)
           reveals the role-reveal layer underneath, which is otherwise
           always fully hidden behind it. */
        .enemy-slot.drag-source .role-reveal {
            opacity: 1;
        }

        .enemy-slot.drag-source .portrait {
            opacity: 0;
        }

        /* Highlighted while a dragged portrait is currently hovering over
           this slot as a potential drop target - a plain highlight only,
           no role-reveal here (that's source-only, see above). */
        .enemy-slot.drag-target {
            outline: 2px dashed var(--gold-bright);
            outline-offset: 2px;
        }

        .enemy-comp .portrait {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            font-size: 8px;
            /* Every enemy portrait reads as "enemy" via a red-toned border,
               not just the assumed opponent - matches the red already used
               for the enemy team everywhere else (ban chips, team header). */
            border-color: rgba(224, 138, 138, 0.55);
        }

        /* Only a portrait with an actual champion picked can be dragged -
           there's nothing to reassign from an empty/dash slot. */
        .enemy-comp .portrait.draggable {
            cursor: grab;
            transition: border-color 0.12s ease, transform 0.08s ease;
        }

        .enemy-comp .portrait.draggable:hover {
            border-color: var(--red);
            transform: translateY(-1px);
        }

        /* The resolved lane opponent - whichever slot matches the local
           player's own role. Bigger and a fully saturated red border/glow
           so it reads as "the one in question," distinct from the muted
           red every other enemy portrait now carries. */
        .enemy-comp .portrait.assumed-opponent {
            font-size: 9px;
            border: 2px solid var(--red);
            box-shadow: 0 0 6px rgba(224, 138, 138, 0.5);
        }

        /* Empty role slot shown before that position's pick comes in -
           dimmer border/background than a filled portrait. '?' rather than
           a role icon - a small position glyph wasn't actually legible
           enough at this size to tell lanes apart - and matches the same
           '?' home.html already uses for an empty portrait slot, rather
           than the plain dash this used to show. Never draggable (no
           champion to reassign) but still a valid drop target. */
        .role-placeholder {
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(200, 155, 60, 0.2);
            color: var(--parchment-faint);
            font-size: 14px;
            font-weight: 300;
        }

        /* Floating clone that follows the pointer while dragging - the
           real portrait stays in place underneath (see drag-source above),
           this is purely the "lifted" visual. */
        .drag-ghost {
            position: fixed;
            z-index: 999;
            pointer-events: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--gold-bright);
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            transform: translate(-50%, -50%) scale(1.15);
            opacity: 0.95;
        }

        .drag-ghost img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        body.dragging-enemy,
        body.dragging-enemy * {
            cursor: grabbing !important;
        }

        .context-empty {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-style: italic;
            color: var(--parchment-faint);
        }

        /* ---- section header ---- */

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }

        .section-header .label {
            font-family: 'Teko', 'Segoe UI', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold-bright);
        }

        .section-header .col-hint {
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 9px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--parchment-faint);
        }

        /* ---- list view ---- */

        .rows {
            display: flex;
            flex-direction: column;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            margin-bottom: 4px;
            background: rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(200, 155, 60, 0.12);
            cursor: pointer;
            transition: border-color 0.15s ease, background 0.15s ease;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .row:hover,
        .row:focus-visible {
            border-color: rgba(200, 155, 60, 0.45);
            outline: none;
        }

        .row.top-pick {
            border-color: var(--gold);
            background: rgba(200, 155, 60, 0.08);
        }

        .rank-diamond {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(45deg);
            border: 1.5px solid var(--gold);
        }

        .rank-diamond.filled {
            background: linear-gradient(160deg, var(--gold-bright), var(--gold));
            border-color: var(--gold-bright);
        }

        .rank-diamond span {
            transform: rotate(-45deg);
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 10px;
            font-weight: 600;
            color: var(--gold-bright);
        }

        .rank-diamond.filled span {
            color: var(--navy-deep);
        }

        .portrait {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
            background: linear-gradient(160deg, #2A3B5C, #16243F);
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-size: 9px;
            letter-spacing: 0.5px;
            color: var(--gold-bright);
            overflow: hidden;
        }

        .portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .row-main {
            flex: 1;
            min-width: 0;
        }

        .row-main .name {
            font-size: 16px;
            font-weight: 500;
            color: var(--parchment);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .row-main .sub-line {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 2px;
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 10.5px;
        }

        .row-main .sub-line .wr {
            color: var(--parchment-dim);
            font-weight: 500;
        }

        .row-main .sub-line .games {
            color: var(--parchment-faint);
        }

        .row-main .sub-line .low-sample {
            color: var(--gold);
        }

        .row-score {
            flex-shrink: 0;
            text-align: right;
        }

        .row-score .total {
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 14px;
            font-weight: 600;
        }

        .row-score .total.pos {
            color: var(--green);
        }

        .row-score .total.neg {
            color: var(--red);
        }

        .row-score .total.dim {
            color: var(--parchment-dim);
        }

        .row-score .breakdown {
            margin-top: 2px;
            display: flex;
            gap: 5px;
            justify-content: flex-end;
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 9px;
        }

        .row-score .breakdown .pos {
            color: var(--green);
        }

        .row-score .breakdown .neg {
            color: var(--red);
        }

        .row-score .breakdown .dim {
            color: var(--parchment-faint);
        }

        .empty {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-style: italic;
            color: var(--parchment-faint);
            padding: 8px 0;
        }

        /* ---- detail view ---- */

        .detail-champ-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0 12px;
        }

        .detail-champ-row .portrait {
            width: 36px;
            height: 36px;
            font-size: 11px;
        }

        .detail-champ-name {
            font-size: 19px;
            font-weight: 500;
            color: var(--parchment);
        }

        .rating-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(200, 155, 60, 0.15);
            padding: 10px 12px;
            margin-bottom: 10px;
        }

        .stat-label {
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 9px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--parchment-faint);
        }

        .stat-value {
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: var(--parchment);
            margin-top: 2px;
        }

        .stat-value.pos {
            color: var(--green);
        }

        .stat-value.neg {
            color: var(--red);
        }

        .stat-value.dim {
            color: var(--parchment-dim);
        }

        .formula-note {
            font-family: 'Inter', sans-serif;
            font-size: 9.5px;
            line-height: 1.5;
            color: var(--parchment-faint);
            margin-bottom: 14px;
        }

        .section-title {
            font-family: 'Teko', 'Segoe UI', sans-serif;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold-bright);
            border-bottom: 1px solid rgba(200, 155, 60, 0.25);
            padding-bottom: 5px;
            margin: 14px 0 6px;
        }

        .section-title:first-of-type {
            margin-top: 0;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 0;
            font-size: 12px;
        }

        .detail-row .portrait {
            width: 20px;
            height: 20px;
            font-size: 7px;
        }

        .detail-row .pos-tag {
            width: 30px;
            flex-shrink: 0;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            color: var(--parchment-faint);
            text-transform: uppercase;
        }

        .detail-row .champ-name {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--parchment);
        }

        .detail-row .wr {
            flex-shrink: 0;
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-weight: 500;
        }

        .detail-row .wr.pos {
            color: var(--green);
        }

        .detail-row .wr.neg {
            color: var(--red);
        }

        .detail-row .n {
            flex-shrink: 0;
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 10px;
            color: var(--parchment-faint);
            width: 66px;
            text-align: right;
        }

        /* ---- footer bar (state / tier) ---- */

        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px -16px 0;
            padding: 8px 16px 0;
            border-top: 1px solid rgba(200, 155, 60, 0.15);
        }

        /* Just the hairline from .footer-bar's border-top, reused on its
           own above "Top picks" - no dot/text/tier content, just the line. */
        .section-divider {
            height: 0;
            margin: 0 -16px 8px;
            border-top: 1px solid rgba(200, 155, 60, 0.15);
        }

        .footer-state {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .footer-state .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            flex-shrink: 0;
        }

        .footer-state .state-text {
            font-family: 'Teko', 'Segoe UI', sans-serif;
            font-size: 10.5px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--parchment-dim);
            line-height: 1;
        }

        .footer-tier {
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 9px;
            letter-spacing: 0.5px;
            color: var(--gold-bright);
            text-transform: uppercase;
            line-height: 1;
            display: inline-flex;
            align-items: center;
        }

        .tier-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-right: 6px;
            vertical-align: middle;
            object-fit: contain;
        }

        /* Shown only if the real rank-emblem image fails to load (asset
           not fetched yet - see README) - the original hand-drawn gold
           diamond as a graceful degradation, not a broken-image icon. */
        .tier-icon-fallback {
            width: 10px;
            height: 10px;
            border: 1px solid var(--gold-bright);
            background: linear-gradient(160deg, var(--gold-bright), var(--gold));
            transform: rotate(45deg);
        }

        /* ---- Windows-only text legibility fixes (toggled via body.is-windows,
           see the platform check at the bottom of the script) ----
           Grayscale AA - needed to fix ClearType stretching on this
           transparent window, see disable-lcd-text in main.js - renders
           text lighter than macOS's font rendering. Every block below
           currently has no explicit font-weight (so it's rendering at the
           browser default, 400) or is explicitly set to 300; each is
           bumped one step, matched to that block's own size/role rather
           than a blanket rule, so headings/labels that were already
           500/600 are untouched. */
        body.is-windows .header .timer,
        body.is-windows .back-btn,
        body.is-windows .role-chip .vs,
        body.is-windows .context-empty,
        body.is-windows .section-header .col-hint,
        body.is-windows .row-main .sub-line,
        body.is-windows .row-score .breakdown,
        body.is-windows .detail-row .pos-tag,
        body.is-windows .detail-row .n,
        body.is-windows .stat-label,
        body.is-windows .formula-note,
        body.is-windows .section-title,
        body.is-windows .footer-state .state-text,
        body.is-windows .footer-tier,
        body.is-windows .empty,
        body.is-windows .portrait,
        body.is-windows .role-reveal {
            font-weight: 500;
        }

        /* .role-placeholder's "?" glyph is explicitly 300 (thinnest weight
           in the loaded set) - on Windows that's barely legible, so it
           gets bumped further than the 400->500 step above. */
        body.is-windows .role-placeholder {
            font-weight: 400;
        }

        /* Text colored with --parchment-faint (#5A5648) or --parchment-dim
           (#A09B8C) is the actual "words reading really low" case: both
           are low-contrast against the navy background even on macOS, and
           Windows' DWM compositing renders that contrast lower still.
           Brightened per element below rather than by redefining the
           shared variables, since --parchment-faint/--parchment-dim are
           also used for a few non-text/decorative things (drag-state
           backdrops, dot markers) that don't have this problem and
           shouldn't change. */
        body.is-windows .role-chip .vs,
        body.is-windows .context-empty,
        body.is-windows .section-header .col-hint,
        body.is-windows .row-main .sub-line .games,
        body.is-windows .row-score .breakdown .dim,
        body.is-windows .formula-note,
        body.is-windows .stat-label,
        body.is-windows .detail-row .pos-tag,
        body.is-windows .detail-row .n,
        body.is-windows .collapse-tab {
            color: #7A7462;
            /* brighter than --parchment-faint's #5A5648 */
        }

        body.is-windows .row-main .sub-line .wr,
        body.is-windows .row-score .total.dim,
        body.is-windows .stat-value.dim,
        body.is-windows .footer-state .state-text {
            color: #B5AF9E;
            /* brighter than --parchment-dim's #A09B8C */
        }
    </style>
</head>

<body>
    <div class="inset" id="insetWrap">
        <div class="frame" id="frame">
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>

            <div class="grip" id="grip" title="Drag to move · double-click to reset size">
                <span></span><span></span><span></span>
            </div>

            <div class="header">
                <span class="title" id="headerTitle">Champ select</span>
                <div class="header-actions">
                    <span class="timer" id="timer">--:--</span>
                </div>
            </div>

            <div class="divider"></div>

            <div id="content"></div>

            <button class="collapse-tab" id="collapseBtn" aria-label="Collapse overlay"
                title="Collapse">&#9662;</button>
        </div>
    </div>

    <script>
        // Keep in sync with OVERLAY_WIDTH in main.js.
        const MIN_HEIGHT = 120;

        const POSITION_LABELS = { top: 'top', jungle: 'jungle', middle: 'mid', bottom: 'bottom', utility: 'support' };
        const SHORT_POSITION_LABELS = { top: 'TOP', jungle: 'JG', middle: 'MID', bottom: 'BOT', utility: 'SUP' };
        const TIER_LABELS = { EMERALD: 'Emerald', 'EMERALD+': 'Emerald+', DIAMOND: 'Diamond', 'DIAMOND+': 'Diamond+', MASTER_PLUS: 'Master+' };
        const LOW_SAMPLE_THRESHOLD = 200;

        // Standard role order for the always-5-slots enemy comp row.
        const ROLE_ORDER = ['top', 'jungle', 'middle', 'bottom', 'utility'];

        let lastSession = null;
        let view = 'list'; // 'list' | 'detail'
        let expandedChampion = null;
        let collapsed = false;
        // Optimistic client-side copy of main.js's manualEnemyRoles - a
        // dragged-and-dropped role reassignment shows immediately, before
        // main.js's next poll tick (~2s) confirms it back through the
        // session's theirTeam[].position. A fresh overlay window is
        // created per champ-select session (see showOverlay()/hideOverlay()
        // in main.js), so this naturally resets to {} every new draft.
        let localRoleOverrides = {};

        function abbreviate(name) {
            return name.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase();
        }

        // Builds a portrait chip: a real Data Dragon icon when iconUrl is
        // available, otherwise the 3-letter abbreviation chip as before.
        // If the icon URL 404s (unresolved id, e.g. for special-case names
        // before nameToId has been populated), wirePortraitFallbacks()
        // below swaps it back to the abbreviation on load error.
        // extraAttrs is a raw string of additional HTML attributes (e.g.
        // `data-cell-id="5" title="..."`) - used by the enemy-comp row to
        // make picked portraits clickable.
        function portraitHtml(name, iconUrl, extraClass, extraAttrs) {
            const cls = 'portrait' + (extraClass ? ' ' + extraClass : '');
            const attrs = extraAttrs ? ' ' + extraAttrs : '';
            if (iconUrl) {
                return `<span class="${cls}"${attrs}><img src="${iconUrl}" alt="${name}" data-fallback="${abbreviate(name)}"></span>`;
            }
            return `<span class="${cls}"${attrs}>${abbreviate(name)}</span>`;
        }

        // Swaps any portrait <img> that failed to load back to its text
        // abbreviation. Call once after each innerHTML render.
        function wirePortraitFallbacks() {
            document.querySelectorAll('.portrait img').forEach((img) => {
                img.addEventListener('error', () => {
                    img.parentElement.textContent = img.dataset.fallback;
                }, { once: true });
            });
        }

        // Official Riot role icons (top/jungle/middle/bottom/utility), a
        // local copy under assets/role-icons/ (see README's "one-time
        // setup" section) rather than hot-linked from CommunityDragon -
        // same reasoning as rankEmblemUrl() in lib/rankEmblem.js: this is
        // a fixed, patch-independent asset, so there's no reason to depend
        // on a third-party mirror's uptime for something that never
        // changes. Used as the .role-reveal backdrop shown underneath a
        // portrait while it's being dragged (previously just the plain
        // SHORT_POSITION_LABELS text). `role` here is already the
        // lowercase LCU-style key (top/jungle/middle/bottom/utility).
        const ROLE_ICON_BASE = '../assets/role-icons/';
        function roleIconUrl(role) {
            return `${ROLE_ICON_BASE}${role}.png`;
        }
        function roleRevealIconHtml(role, fallbackLabel) {
            return `<img class="role-reveal-icon" src="${roleIconUrl(role)}" alt="${fallbackLabel}" data-fallback="${fallbackLabel}">`;
        }

        // Swaps a broken role-reveal icon (assets/role-icons/ not fetched
        // yet - see README) back to the plain text label it replaced -
        // same graceful-degradation pattern as wirePortraitFallbacks() and
        // wireTierIconFallback() below.
        function wireRoleRevealFallbacks() {
            document.querySelectorAll('.role-reveal-icon').forEach((img) => {
                img.addEventListener('error', () => {
                    img.replaceWith(document.createTextNode(img.dataset.fallback));
                }, { once: true });
            });
        }

        // Swaps a broken rank-emblem <img> (e.g. before the fetch/flatten
        // setup steps have been run - see README) for the plain gold-diamond
        // CSS fallback instead of a browser broken-image icon.
        function wireTierIconFallback() {
            const img = document.querySelector('.tier-icon[data-fallback]');
            if (!img) return;
            img.addEventListener('error', () => {
                const fallback = document.createElement('span');
                fallback.className = 'tier-icon tier-icon-fallback';
                img.replaceWith(fallback);
            }, { once: true });
        }

        function formatTime(totalSeconds) {
            const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
            const s = String(totalSeconds % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function posLabel(position, map) {
            if (!position) return '—';
            const key = position.toLowerCase();
            return map[key] || position;
        }

        // "184000" -> "184K", matching the sample-size shorthand used
        // throughout the rest of the app's data displays.
        function formatGames(n) {
            if (n >= 1000) return `${Math.round(n / 1000)}K`;
            return String(n);
        }

        function resize(height, forced) {
            if (window.overlayAPI && window.overlayAPI.resize) {
                window.overlayAPI.resize(height, forced);
            }
        }

        // Measures the actual rendered content height and resizes the
        // window to match exactly - no cap, no internal scrolling. .frame
        // and .inset are height:auto (content-driven, not 100%-of-window),
        // so this reflects what the content really needs rather than
        // whatever the window's current/stale size happens to be.
        // main.js only clamps against the screen's work area so the
        // window can't render off-screen - that's a display-safety bound,
        // not a content cap.
        function fitToContent() {
            if (collapsed) return; // frozen at header-only height until expanded
            requestAnimationFrame(() => {
                const insetWrap = document.getElementById('insetWrap');
                const natural = Math.ceil(insetWrap.getBoundingClientRect().height) + 1; // +1px rounding safety
                resize(Math.max(MIN_HEIGHT, natural));
            });
        }

        // Measures whatever the frame's natural content height currently is
        // (list, detail, or collapsed-to-header) and forces the window to
        // match it - "forced" bypasses the manual-resize lock below and
        // re-enables auto-fit going forward. Used by the collapse toggle
        // and by double-clicking the drag grip (a "reset size" escape
        // hatch after a manual edge-drag resize).
        function forceFitToContent() {
            requestAnimationFrame(() => {
                const insetWrap = document.getElementById('insetWrap');
                const natural = Math.ceil(insetWrap.getBoundingClientRect().height) + 1;
                const floor = collapsed ? 0 : MIN_HEIGHT; // don't fight the collapsed header-only height
                resize(Math.max(floor, natural), true);
            });
        }

        function setCollapsed(value) {
            collapsed = value;
            document.getElementById('content').style.display = collapsed ? 'none' : '';
            const btn = document.getElementById('collapseBtn');
            btn.innerHTML = collapsed ? '&#9656;' : '&#9662;';
            btn.title = collapsed ? 'Expand' : 'Collapse';
            btn.setAttribute('aria-label', collapsed ? 'Expand overlay' : 'Collapse overlay');
            forceFitToContent();
        }

        document.getElementById('collapseBtn').addEventListener('click', () => setCollapsed(!collapsed));
        document.getElementById('grip').addEventListener('dblclick', forceFitToContent);

        // ---- list view ----

        function renderBrand() {
            document.getElementById('headerTitle').innerHTML =
                '<span class="brand"><span class="brand-mark"></span><span class="brand-name">LoLens</span></span>';
        }

        function renderContextBar(session) {
            const myPick = (session.myTeam || []).find((p) => p.cellId === session.localPlayerCellId);
            const posKey = myPick && myPick.position ? myPick.position.toLowerCase() : null;
            const roleText = posKey ? (SHORT_POSITION_LABELS[posKey] || posKey.toUpperCase()) : '—';
            const roleChip = `<div class="role-chip"><span class="role-text">${roleText}</span><span class="vs">vs</span></div>`;

            // Fixed TOP/JG/MID/BOT/SUP order, left to right - stable slot
            // positions so a drag means something concrete (drop target =
            // that role), rather than the row reshuffling around whichever
            // pick currently matters most.
            const slots = buildEnemySlots(effectiveEnemyTeam(session.theirTeam));

            // "My opponent" is just whichever slot matches my own role, now
            // that roles are fixed positions rather than a separately
            // resolved guess. Falls back to whatever main.js already
            // resolved server-side only when my own role isn't known yet
            // (very early draft).
            const mySlot = posKey ? slots.find((s) => s.role === posKey) : null;
            const resolvedCellId = mySlot && mySlot.pick ? mySlot.pick.cellId : (session.laneOpponentCellId ?? null);

            const slotsHtml = slots.map(({ role, pick }) => {
                const isAssumed = Boolean(pick) && pick.cellId === resolvedCellId;
                const wrapperClasses = ['enemy-slot', isAssumed ? 'assumed-slot' : ''].filter(Boolean).join(' ');
                const roleLabel = SHORT_POSITION_LABELS[role] || role.toUpperCase();
                const roleReveal = `<div class="role-reveal">${roleRevealIconHtml(role, roleLabel)}</div>`;

                if (pick && pick.championName) {
                    const portraitClasses = ['draggable', isAssumed ? 'assumed-opponent' : ''].filter(Boolean).join(' ');
                    const title = isAssumed
                        ? `Assumed opponent (${roleLabel}) — drag to reassign`
                        : `Drag to reassign this champion's role`;
                    const portrait = portraitHtml(
                        pick.championName, pick.iconUrl, portraitClasses,
                        `data-cell-id="${pick.cellId}" data-role="${role}" title="${title}"`
                    );
                    return `<div class="${wrapperClasses}" data-role="${role}">${roleReveal}${portrait}</div>`;
                }

                return `<div class="${wrapperClasses}" data-role="${role}">${roleReveal}<span class="portrait role-placeholder" title="${roleLabel}">?</span></div>`;
            }).join('');

            const rightSide = `<div class="enemy-comp">${slotsHtml}</div>`;

            return `<div class="context-bar">${roleChip}${rightSide}</div>`;
        }

        // Applies any pending local drag overrides on top of the session's
        // own theirTeam data, exactly mirroring how main.js applies
        // manualEnemyRoles server-side - so the overlay's own bucketing
        // and main.js's eventual confirmation never disagree once main.js
        // catches up.
        function effectiveEnemyTeam(theirTeam) {
            return (theirTeam || []).map((p) => ({
                ...p,
                position: localRoleOverrides[p.cellId] || p.position
            }));
        }

        // Buckets a (possibly locally-overridden) enemy team into the five
        // fixed role slots: fill by position first, then drop anyone with a
        // blank/unrecognized position into whatever slots are left, in
        // order - same fallback custom games with no assignedPosition need.
        function buildEnemySlots(theirTeam) {
            const byPosition = {};
            const unassigned = [];
            for (const p of theirTeam) {
                const key = p.position ? p.position.toLowerCase() : null;
                if (key && ROLE_ORDER.includes(key) && !byPosition[key]) {
                    byPosition[key] = p;
                } else {
                    unassigned.push(p);
                }
            }
            return ROLE_ORDER.map((role) => ({
                role,
                pick: byPosition[role] || (unassigned.length > 0 ? unassigned.shift() : null)
            }));
        }

        // ---- enemy role drag-and-drop ----
        //
        // Replaces the old click-to-select lane opponent: dragging any
        // picked enemy portrait into a role slot reassigns it there. If the
        // target slot already holds another enemy, the two swap roles; if
        // the target is empty, the dragged enemy just moves there. Both
        // cases flow through the same "effective position" mechanism
        // main.js uses server-side (manualEnemyRoles), so lane-opponent
        // resolution, Counter Δ, and the report all pick up the change
        // automatically - "who's my opponent" is just whichever slot ends
        // up matching the player's own role, nothing else to wire.

        let dragState = null; // { cellId, sourceRole, ghostEl, currentTargetRole }

        function startEnemyDrag(e, cellId, sourceRole, portraitEl, slotEl) {
            e.preventDefault();

            const ghost = document.createElement('div');
            ghost.className = 'drag-ghost';
            ghost.innerHTML = portraitEl.innerHTML;
            ghost.style.left = `${e.clientX}px`;
            ghost.style.top = `${e.clientY}px`;
            document.body.appendChild(ghost);
            document.body.classList.add('dragging-enemy');

            // The portrait is the "lid" over this slot's role label - lift
            // it away (fade it out) and the role-reveal underneath shows
            // through, via the .drag-source CSS rules.
            slotEl.classList.add('drag-source');

            dragState = { cellId, sourceRole, ghostEl: ghost, currentTargetRole: null };

            const onMove = (moveEvent) => {
                if (!dragState) return;
                dragState.ghostEl.style.left = `${moveEvent.clientX}px`;
                dragState.ghostEl.style.top = `${moveEvent.clientY}px`;

                let hoveredRole = null;
                document.querySelectorAll('.enemy-slot').forEach((slot) => {
                    const r = slot.getBoundingClientRect();
                    const inside = moveEvent.clientX >= r.left && moveEvent.clientX <= r.right
                        && moveEvent.clientY >= r.top && moveEvent.clientY <= r.bottom;
                    slot.classList.toggle('drag-target', inside);
                    if (inside) hoveredRole = slot.dataset.role;
                });
                dragState.currentTargetRole = hoveredRole;
            };

            const onUp = () => {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);
                finishEnemyDrag();
            };

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        }

        function finishEnemyDrag() {
            if (!dragState || !lastSession) { dragState = null; return; }
            const { cellId, sourceRole, ghostEl, currentTargetRole } = dragState;

            ghostEl.remove();
            document.body.classList.remove('dragging-enemy');
            document.querySelectorAll('.enemy-slot').forEach((slot) => {
                slot.classList.remove('drag-source', 'drag-target');
            });

            // Dropped outside every slot, or back onto the slot it started
            // in - no-op, nothing to send.
            if (currentTargetRole && currentTargetRole !== sourceRole) {
                const slots = buildEnemySlots(effectiveEnemyTeam(lastSession.theirTeam));
                const targetSlot = slots.find((s) => s.role === currentTargetRole);
                const occupant = targetSlot ? targetSlot.pick : null;

                localRoleOverrides[cellId] = currentTargetRole;
                if (window.overlayAPI && window.overlayAPI.setEnemyRole) {
                    window.overlayAPI.setEnemyRole(cellId, currentTargetRole);
                }

                // Target slot already had someone in it - swap, don't just
                // overwrite them (they'd otherwise vanish from every role).
                if (occupant && occupant.cellId !== cellId) {
                    localRoleOverrides[occupant.cellId] = sourceRole;
                    if (window.overlayAPI && window.overlayAPI.setEnemyRole) {
                        window.overlayAPI.setEnemyRole(occupant.cellId, sourceRole);
                    }
                }
            }

            dragState = null;
            renderCurrent();
        }

        function wireEnemyDrag() {
            document.querySelectorAll('.enemy-slot .portrait.draggable[data-cell-id]').forEach((el) => {
                el.addEventListener('mousedown', (e) => {
                    const slotEl = el.closest('.enemy-slot');
                    const cellId = Number(el.dataset.cellId);
                    const sourceRole = el.dataset.role;
                    startEnemyDrag(e, cellId, sourceRole, el, slotEl);
                });
            });
        }

        // A drag holds no reference to the DOM node it lifted beyond the
        // moment startEnemyDrag() adds .drag-source to it - any render
        // that happens while dragging (a live session update, which lands
        // every ~2s regardless of what the user is doing) tears down and
        // rebuilds that node, silently dropping the class along with it.
        // dragState.cellId survives that rebuild (it's just a number), so
        // once the new DOM exists this finds wherever that champion's
        // portrait landed and re-lifts it - same for the currently
        // hovered drop target, if any. mousemove's own hit-testing already
        // re-queries .enemy-slot live on every move, so it needs no such
        // fix-up; this is only for the state a render silently erases.
        function reapplyDragVisual() {
            if (!dragState) return;
            const portrait = document.querySelector(`.portrait[data-cell-id="${dragState.cellId}"]`);
            const slotEl = portrait ? portrait.closest('.enemy-slot') : null;
            if (slotEl) slotEl.classList.add('drag-source');

            if (dragState.currentTargetRole) {
                const targetSlot = document.querySelector(`.enemy-slot[data-role="${dragState.currentTargetRole}"]`);
                if (targetSlot) targetSlot.classList.add('drag-target');
            }
        }

        function renderFooter(session) {
            const tierLabel = TIER_LABELS[session.populationTier] || session.populationTier || '—';
            const emblem = session.tierEmblemUrl
                ? `<img class="tier-icon" src="${session.tierEmblemUrl}" alt="" data-fallback="1">`
                : `<span class="tier-icon tier-icon-fallback"></span>`;
            return `
        <div class="footer-bar">
            <div class="footer-state"><span class="dot"></span><span class="state-text">Champion Select</span></div>
            <span class="footer-tier">${emblem}${tierLabel}</span>
        </div>`;
        }

        function renderRecRow(r, rank) {
            const b = r.breakdown;
            const isTop = rank === 1;

            const scoreCls = r.score >= 50 ? 'pos' : 'neg';

            const wrText = b.baseline ? `${b.baseline.winRate}%` : '—';
            const gamesText = b.baseline ? formatGames(b.baseline.games) : '';
            const lowSample = b.baseline && b.baseline.games < LOW_SAMPLE_THRESHOLD;

            const chip = (label, delta) => {
                if (delta === null) return `<span class="dim">${label} —</span>`;
                const cls = delta > 0 ? 'pos' : delta < 0 ? 'neg' : 'dim';
                const sign = delta > 0 ? '+' : '';
                return `<span class="${cls}">${label} ${sign}${delta}</span>`;
            };

            return `
        <div class="row${isTop ? ' top-pick' : ''}" data-champ="${r.champion}" role="button" tabindex="0" aria-label="Show breakdown for ${r.champion}">
            <span class="rank-diamond${isTop ? ' filled' : ''}"><span>${rank}</span></span>
            ${portraitHtml(r.champion, r.iconUrl)}
            <div class="row-main">
                <div class="name">${r.champion}</div>
                <div class="sub-line">
                    <span class="wr">${wrText}</span>
                    <span class="games">${gamesText}</span>
                    ${lowSample ? '<span class="low-sample">&#9888;</span>' : ''}
                </div>
            </div>
            <div class="row-score">
                <div class="total ${scoreCls}">${r.score}%</div>
                <div class="breakdown">${chip('S', b.synergyDelta)}${chip('C', b.matchupDelta)}</div>
            </div>
        </div>`;
        }

        function renderList(session) {
            renderBrand();

            const recs = (session.recommendations || []).slice(0, 5);
            const rowsHtml = recs.length > 0
                ? recs.map((r, i) => renderRecRow(r, i + 1)).join('')
                : '<div class="empty">No pool recommendations yet</div>';

            document.getElementById('content').innerHTML = `
        ${renderContextBar(session)}
        <div class="section-divider"></div>
        <div class="section-header"><span class="label">Top picks</span><span class="col-hint">Win% &middot; &Delta;</span></div>
        <div class="rows">${rowsHtml}</div>
        ${renderFooter(session)}
      `;

            document.querySelectorAll('.row[data-champ]').forEach((row) => {
                const openDetail = () => {
                    expandedChampion = row.dataset.champ;
                    view = 'detail';
                    renderCurrent();
                };
                row.addEventListener('click', openDetail);
                row.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        openDetail();
                    }
                });
            });

            wirePortraitFallbacks();
            wireTierIconFallback();
            wireRoleRevealFallbacks();
            wireEnemyDrag();
            reapplyDragVisual();
            fitToContent();
        }

        function renderDetail(session) {
            const rec = (session.recommendations || []).find((r) => r.champion === expandedChampion);

            // Champion fell out of the recommendation list (e.g. it just got
            // picked/banned) - fall back to the list rather than show stale data.
            if (!rec) {
                view = 'list';
                renderList(session);
                return;
            }

            document.getElementById('headerTitle').innerHTML =
                '<button class="back-btn" id="backBtn">&#9666; Back</button>';

            const b = rec.breakdown;

            const statCell = (label, value, cls) => `
        <div>
          <div class="stat-label">${label}</div>
          <div class="stat-value ${cls || ''}">${value}</div>
        </div>`;

            const deltaCell = (label, delta) => {
                if (delta === null) return statCell(label, '—', 'dim');
                const cls = delta > 0 ? 'pos' : delta < 0 ? 'neg' : 'dim';
                const sign = delta > 0 ? '+' : '';
                return statCell(label, `${sign}${delta}%`, cls);
            };

            const ratingGrid = [
                statCell('Rating', `${rec.score}%`, rec.score >= 50 ? 'pos' : 'neg'),
                statCell('Base WR', b.baseline ? `${b.baseline.winRate}%` : '—', 'dim'),
                b.personalDelta !== null ? deltaCell('Personal Δ', b.personalDelta) : null,
                deltaCell('Synergy Δ', b.synergyDelta),
                deltaCell('Counter Δ', b.matchupDelta),
                deltaCell('Total Δ', b.totalDelta)
            ].filter(Boolean).join('');

            const detailRow = (entry, shortMap) => {
                const cls = entry.winRate >= 50 ? 'pos' : 'neg';
                const lowSample = entry.games < LOW_SAMPLE_THRESHOLD ? '&#9888; ' : '';
                return `
        <div class="detail-row">
            ${portraitHtml(entry.championName, entry.iconUrl)}
            <span class="pos-tag">${posLabel(entry.position, shortMap)}</span>
            <span class="champ-name">${entry.championName}</span>
            <span class="wr ${cls}">${entry.winRate}%</span>
            <span class="n">${lowSample}n=${entry.games.toLocaleString()}</span>
        </div>`;
            };

            const synergySection = `
        <div class="section-title">Ally synergy</div>
        ${b.synergyList.length > 0
                    ? b.synergyList.map((e) => detailRow(e, SHORT_POSITION_LABELS)).join('')
                    : '<div class="empty">No allies picked yet</div>'}
      `;

            const counterSection = `
        <div class="section-title">Enemy counter</div>
        ${b.matchupList.length > 0
                    ? b.matchupList.map((e) => detailRow(e, SHORT_POSITION_LABELS)).join('')
                    : '<div class="empty">No enemy picks yet</div>'}
      `;

            document.getElementById('content').innerHTML = `
        <div class="detail-champ-row">
          ${portraitHtml(rec.champion, rec.iconUrl)}
          <span class="detail-champ-name">${rec.champion}</span>
        </div>
        <div class="rating-grid">${ratingGrid}</div>
        <div class="formula-note">Rating = Base WR + Personal Δ + Counter Δ + Synergy Δ<br>(each term only counted when real data supports it)</div>
        ${synergySection}
        ${counterSection}
      `;

            document.getElementById('backBtn').addEventListener('click', () => {
                view = 'list';
                expandedChampion = null;
                renderCurrent();
            });

            wirePortraitFallbacks();
            fitToContent();
        }

        function renderCurrent() {
            if (!lastSession) return;
            if (view === 'detail' && expandedChampion) {
                renderDetail(lastSession);
            } else {
                renderList(lastSession);
            }
        }

        function render(session) {
            lastSession = session;
            document.getElementById('timer').textContent = formatTime(session.timeLeftSeconds);
            // Always re-render, even mid-drag - a new enemy pick/ban or a
            // timer tick during a drag should still show up live. What
            // caused the "pop back" look wasn't the re-render itself, it
            // was that re-rendering wipes the .drag-source class straight
            // off the dragged slot (see renderList()'s reapplyDragVisual()
            // call, which puts it right back based on dragState.cellId).
            renderCurrent();
        }

        if (!window.overlayAPI) {
            document.getElementById('content').innerHTML =
                '<div class="empty">overlayAPI not available — check overlay-preload.js path/placement</div>';
        } else {
            // Drives the body.is-windows CSS overrides above - see
            // overlay-preload.js for why Windows needs the boost.
            if (window.overlayAPI.platform === 'win32') {
                document.body.classList.add('is-windows');
            }
            window.overlayAPI.onUpdate(render);
        }
    </script>
</body>

</html>
